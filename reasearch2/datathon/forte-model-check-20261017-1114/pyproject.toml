[project]
name = "forte-cash-checker"
version = "1.0.0"
description = "Fully local cash-discipline video checker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.3",
  "opencv-python>=4.11,<6",
  "onnxruntime>=1.23,<2",
  "supervision==0.27.0",
  "numpy>=2,<3",
  "Pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

