- rule_id: L-NO-CASH-ON-LEAVE
  title_ru: 'Наличные/ценности оставлены без присмотра: кассир покинул рабочее место'
  title_en: 'Cash left unattended: the cashier left the desk'
  mechanism: The cashier is away from the desk for at least min_away_s; within the first check_window_s
    of the absence, cash or a cash bag is visible on the desk at least cash_frac_threshold of the time.
  states_used:
  - cashier_at_desk
  - desk_cash
  - desk_bag
  params:
    min_away_s: 3.0
    min_samples: 2.0
    check_window_s: 6.0
    cash_frac_threshold: 0.5
  description_template: С {t_start} по {t_end} с кассир отсутствует на рабочем месте; на столе видны {object}.
  visibility_caveat: Видео не показывает номинал и принадлежность купюр, только их визуальное присутствие
    на столе.
  norm_ids:
  - 231-20-2
  - 231-22
  enabled: true
- rule_id: L-SAFE-LOCKED-ON-LEAVE
  title_ru: Ключ оставлен в замке сейфа
  title_en: Key left in the safe lock
  mechanism: After the cashier exits the room (within the away run), a key is visible sticking out of
    the safe lock for at least key_frac_threshold of the post-exit exit_window_s.
  states_used:
  - cashier_at_desk
  - cashier_in_room
  - key_in_safe_lock
  - cashier_action
  params:
    min_away_s: 3.0
    min_samples: 2.0
    exit_window_s: 3.0
    key_frac_threshold: 0.5
    key_lookback_s: 5.0
  description_template: С {t_start} по {t_end} с, после выхода кассира из комнаты, ключ виден в замке
    сейфа.
  visibility_caveat: По видео не подтверждается, заперт ли сейф механически, только положение ключа в
    замке.
  norm_ids:
  - 231-80-1
  enabled: true
- rule_id: L-PC-LOCKED
  title_ru: Рабочее место (ноутбук) оставлено незаблокированным
  title_en: Workstation (laptop) left unlocked
  mechanism: After the cashier exits the room, the laptop screen is classified 'unlocked' for at least
    unlocked_frac_threshold of the remaining away run.
  states_used:
  - cashier_at_desk
  - cashier_in_room
  - laptop_screen
  params:
    min_away_s: 3.0
    min_samples: 2.0
    unlocked_frac_threshold: 0.6
  description_template: С {t_start} по {t_end} с, после выхода кассира из комнаты, экран ноутбука остаётся
    разблокированным (рабочий экран, не заставка блокировки).
  visibility_caveat: Фактическая блокировка операционной системы (пароль/сессия) по видео не подтверждается,
    только визуальное состояние экрана.
  norm_ids:
  - 53-71-9
  enabled: true
- rule_id: L-NO-DOCS-ON-LEAVE
  title_ru: Документы/носители оставлены на столе при уходе
  title_en: Documents/media left on the desk on exit
  mechanism: After the cashier exits the room, documents are visible on the desk for at least docs_frac_threshold
    of the same post-exit window used by L-SAFE-LOCKED-ON-LEAVE.
  states_used:
  - cashier_at_desk
  - cashier_in_room
  - desk_documents
  params:
    min_away_s: 3.0
    min_samples: 2.0
    docs_frac_threshold: 0.5
    exit_window_s: 3.0
  description_template: С {t_start} по {t_end} с, после выхода кассира из комнаты, на столе видны документы
    или носители.
  visibility_caveat: Содержимое документов и факт их конфиденциальности по видео не определяются.
  norm_ids:
  - 231-80-3
  enabled: true
- rule_id: S-SAFE-CLOSED
  title_ru: Сейф (хранилище) оставлен открытым
  title_en: Safe/vault left open
  mechanism: The safe door is visible open, and the cashier's action is not 'at_safe', for at least safe_open_s
    continuously.
  states_used:
  - safe_door
  - cashier_action
  params:
    safe_open_s: 4.0
  description_template: С {t_start} по {t_end} с сейф открыт, а кассир находится не у сейфа.
  visibility_caveat: Физический статус замка сейфа по видео не определяется, только положение дверцы.
  norm_ids:
  - 231-20-2b
  enabled: true
- rule_id: S-CLEAN-DESK-HANDOVER
  title_ru: Деньги предыдущего клиента не убраны при обслуживании следующего
  title_en: Previous client's cash not cleared before the next one
  mechanism: A new client session starts (clients_at_desk >= 1, merged across gaps <= session_gap_s) while
    cash was visible on the desk for at least cash_frac_threshold of the cash_lookback_s before the session's
    entry moment.
  states_used:
  - clients_at_desk
  - desk_cash
  - person_at_door
  params:
    session_gap_s: 2.5
    min_samples: 2.0
    entry_lookback_s: 4.0
    cash_lookback_s: 3.0
    cash_frac_threshold: 0.6
  description_template: В {t_end} с начинается обслуживание следующего клиента; наличные предыдущей операции
    ещё видны на столе.
  visibility_caveat: Принадлежность конкретных купюр предыдущему клиенту не подтверждается, только непрерывное
    визуальное присутствие наличных на столе между сессиями.
  norm_ids:
  - 231-20-2
  enabled: true
- rule_id: S-NO-MERGE
  title_ru: Наличные разных клиентов смешаны на рабочем месте
  title_en: Different clients' cash merged on the desk
  mechanism: Within a session flagged by S-CLEAN-DESK-HANDOVER, the cashier receives or counts cash from
    the new client at least merge_min_gap_s after that session started, while the previous client's cash
    was still visible.
  states_used:
  - clients_at_desk
  - cash_in_hands_of
  - cashier_action
  params:
    merge_min_gap_s: 3.0
  description_template: В {t} с кассир работает с наличными нового клиента, пока на столе остаются наличные
    предыдущей операции.
  visibility_caveat: Принадлежность купюр конкретной сессии не прослеживается покадрово по видео.
  norm_ids:
  - 231-20-2
  - 231-21
  enabled: true
- rule_id: A-OUTSIDER-ZONE
  title_ru: Посторонний в кассовой кабине
  title_en: An outsider in the cashier booth
  mechanism: Two or more people are on the cashier's side of the desk at once, with no collector present,
    for at least min_samples consecutive samples.
  states_used:
  - people_cashier_side
  - collector_present
  params:
    min_samples: 2.0
  description_template: С {t_start} по {t_end} с на стороне кассира находится {people_count} человек(а)
    одновременно.
  visibility_caveat: Роль каждого человека (сотрудник/посторонний) определяется по положению в кадре,
    не по документам или должности.
  norm_ids:
  - 14-16-1
  - 14-8-1
  enabled: true
- rule_id: A-DOOR-LOCK
  title_ru: Дверь кассы не закрыта
  title_en: Cash-room door not closed
  mechanism: The room door is open for at least door_open_s, and the cashier is at the desk for at least
    presence_frac_threshold of that time.
  states_used:
  - room_door
  - cashier_at_desk
  params:
    door_open_s: 4.0
    presence_frac_threshold: 0.5
  description_template: С {t_start} по {t_end} с дверь кассового помещения открыта, пока кассир работает
    за столом.
  visibility_caveat: Фактическое запирание двери на замок по видео не подтверждается, только открытое/закрытое
    положение.
  norm_ids:
  - 14-16-1
  - 14-8-1
  enabled: true
- rule_id: A-SECOND-PERSON
  title_ru: Одновременное обслуживание нескольких клиентов
  title_en: Two clients served at once
  mechanism: Two or more clients are at the client side of the desk at once, with no collector present,
    for at least min_samples consecutive samples.
  states_used:
  - clients_at_desk
  - collector_present
  params:
    min_samples: 2.0
  description_template: С {t_start} по {t_end} с одновременно несколько клиентов обслуживаются за столом.
  visibility_caveat: Число и личности клиентов определяются визуально, не по документам.
  norm_ids:
  - 231-20-2
  - 231-21
  enabled: true
- rule_id: C-COUNT-BEFORE-EXIT
  title_ru: Пересчёт денег не в присутствии клиента (клиент ушёл)
  title_en: Cash counted without the client present (client left)
  mechanism: A client session ends and, in the window around the end (count_window_before_s before, count_window_after_s
    after), counting is active for at least count_frac_threshold of that window.
  states_used:
  - clients_at_desk
  - counting_machine_in_use
  - cashier_action
  params:
    session_gap_s: 2.5
    min_samples: 2.0
    entry_lookback_s: 4.0
    count_window_before_s: 3.0
    count_window_after_s: 2.0
    count_frac_threshold: 0.5
  description_template: В {t} с клиент покидает стол, пока наличные ещё пересчитываются или проверяются
    на машине.
  visibility_caveat: Завершение пересчёта определяется по действию кассира/машине, а не по итоговой сумме.
  norm_ids:
  - 231-20-1
  enabled: true
- rule_id: C-ID-BEFORE-CASH
  title_ru: Приём наличных без предъявления документа клиентом
  title_en: Cash accepted without an ID document shown
  mechanism: The first cash handover of a client session happens with no document shown (id_document_visible
    / checking_id_document) in the id_lookback_s before it or earlier in the session.
  states_used:
  - clients_at_desk
  - cash_in_hands_of
  - cashier_action
  - id_document_visible
  params:
    session_gap_s: 2.5
    min_samples: 2.0
    entry_lookback_s: 4.0
    id_lookback_s: 2.0
  description_template: В {t} с зафиксирована первая передача наличных клиентом; показ документа ранее
    в сессии не зафиксирован.
  visibility_caveat: Подлинность и тип документа по видео не определяются, только факт его предъявления
    в кадре.
  norm_ids:
  - 231-19-1
  - 231-7
  enabled: true
- rule_id: C-DETECTOR-CHECK
  title_ru: Пересчёт без проверки подлинности на детекторе (эксперимент)
  title_en: Counting without a detector check (experimental)
  mechanism: 'Experimental, whole-video check: the cashier is seen counting by hand at some point, and
    the detector is never seen in use anywhere in the observed timeline.'
  states_used:
  - cashier_action
  - detector_in_use
  params: {}
  description_template: В {t} с кассир пересчитывает наличные вручную; использование детектора подлинности
    не зафиксировано ни в одном наблюдаемом кадре.
  visibility_caveat: 'Экспериментальное правило: отсутствие детектора оценивается по всему наблюдаемому
    видео, что не покрывает интервалы между сэмплами и части кадра вне обзора.'
  norm_ids:
  - 231-19-2b
  enabled: false
- rule_id: W-NO-PERSONAL-ITEMS
  title_ru: Личные вещи на рабочем месте кассира
  title_en: Personal items at the cashier's workplace
  mechanism: Personal items (coat, bag, backpack) are visible on the desk for at least min_samples consecutive
    samples.
  states_used:
  - desk_personal_items
  params:
    min_samples: 2.0
  description_template: С {t_start} по {t_end} с на рабочем столе кассира находятся личные вещи.
  visibility_caveat: Принадлежность вещи кассиру, а не клиенту, не всегда достоверна по видео.
  norm_ids:
  - 231-12-1
  enabled: true
- rule_id: W-NO-FOOD
  title_ru: Еда/напитки на рабочем месте кассира
  title_en: Food/drink at the cashier's workplace
  mechanism: Food or drink is visible on the desk, or the cashier's action is 'eating_drinking', for at
    least min_samples consecutive samples.
  states_used:
  - desk_food_drink
  - cashier_action
  params:
    min_samples: 2.0
  description_template: С {t_start} по {t_end} с на рабочем месте кассира видны еда или напитки.
  visibility_caveat: Факт употребления пищи не подтверждается, только присутствие еды/напитка в кадре.
  norm_ids:
  - 231-12-2
  enabled: true
- rule_id: W-NO-CAMERA-PHONE
  title_ru: Телефон в руках кассира в кассовом узле
  title_en: Phone in the cashier's hands in the cash unit
  mechanism: The phone is visible in the cashier's hand, or the cashier's action is 'using_phone', for
    at least min_samples consecutive samples.
  states_used:
  - phone_in_cashier_hand
  - cashier_action
  params:
    min_samples: 2.0
  description_template: С {t_start} по {t_end} с у кассира в руках телефон на рабочем месте.
  visibility_caveat: Содержание звонка или переписки не определяется, только факт удержания телефона.
  norm_ids:
  - 231-12-2b
  enabled: true
- rule_id: K-SEAL-CHECK
  title_ru: Сумка от инкассатора принята без проверки (инкассатор сразу ушёл)
  title_en: Collector's bag accepted without inspection (collector left right away)
  mechanism: A collector is present; a bag appears on the desk; the collector leaves within collector_quick_s
    of the bag appearing.
  states_used:
  - collector_present
  - desk_bag
  params:
    collector_quick_s: 6.0
  description_template: В {t_end} с инкассатор покидает помещение в пределах {collector_quick_s:.0f} с
    после появления сумки на столе; совместный осмотр сумки не зафиксирован.
  visibility_caveat: Содержимое сумки и целостность пломбы по видео не проверяются, только присутствие
    сумки и людей.
  norm_ids:
  - 231-24-3
  - 231-24-4
  enabled: true
- rule_id: K-RECOUNT-BEFORE-SAFE
  title_ru: Деньги из вскрытой сумки убраны в сейф без пересчёта
  title_en: Cash from an opened bag moved to the safe without a recount
  mechanism: After the cashier opens a bag (cashier_action='packing_or_opening_bag'), the safe is used
    (open, or cashier_action='at_safe') before any counting is observed in between.
  states_used:
  - cashier_action
  - safe_door
  - counting_machine_in_use
  params: {}
  description_template: В {t} с кассир использует сейф после вскрытия сумки; пересчёт содержимого между
    этими моментами не зафиксирован.
  visibility_caveat: Факт пересчёта подтверждается по видимому действию или работе машины, а не по итоговой
    сумме.
  norm_ids:
  - 231-74-1
  - 231-42
  enabled: true
