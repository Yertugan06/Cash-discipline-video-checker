  - desk_cash
  - desk_bag
  params:
    min_away_s: 3.0
    min_samples: 2.0
    check_window_s: 6.0
    cash_frac_threshold: 0.5
  description_template: '{interval} кассир отсутствует на рабочем месте; на столе видны {object}.'
  visibility_caveat: Видео не показывает номинал и принадлежность купюр, только их визуальное присутствие
    на столе.
  norm_ids:
  - 231-20-2
  - 231-22
  citation_strengths:
    231-20-2: direct
    231-22: direct
  enabled: true
  disabled_reason: null
  jury_eligible: false
