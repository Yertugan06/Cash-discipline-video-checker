# Atomic requirements derived from the law (knowledge/README.md, "Requirements and coverage").
# Discovery: three LLM readers each read one part of sources/<act>/text.txt WITHOUT the rulebook or
# the detector code, on 2026-10-18, and wrote id..plausible_in_dataset. Then model_support, decision,
# rules and decision_note were set by comparing with knowledge/rulebook.yaml and backend/f1/rules.py.
# Every quote is checked verbatim against its unit by scripts/build_legal_catalog.py.
# Machine-proposed; a person confirms. This is not a rulebook: rules live only in rulebook.yaml.
# decision: implemented | implemented_weak | new_existing_signals | new_needs_logic |
#           not_verifiable | not_applicable          model_support: yes | partial | no
requirements:
- id: R-231-9-a
  unit: 231-9-c1
  quote: Банк обеспечивает наличие специальных оборудований для определения платежности и подлинности
    банкнот при осуществлении кассовых операций.
  subject: кассовый работник
  kind: required
  requirement: На рабочем месте кассового работника присутствует оборудование для проверки подлинности
    и платежности банкнот
  conditions: во время кассовых операций
  breach_visual: кассовый работник выполняет операции с наличными деньгами, но на столе отсутствует счетная
    машина или устройство для проверки подлинности
  signals:
  - cash_on_desk
  - banknote_counting_machine_present
  evidence: счетная машина видна на столе кассира или рядом с ним; используется при работе с банкнотами
  insufficient_when: невозможно определить, включено ли оборудование и работает ли оно
  observability: direct
  plausible_in_dataset: 'yes'
  model_support: partial
  decision: not_verifiable
  rules: []
  decision_note: Счётная машина распознаётся как объект сцены, но её отсутствие в кадре не доказывает
    отсутствия оборудования на рабочем месте (ракурс, детектор подлинности может быть вне кадра).
- id: R-231-11-a
  unit: 231-11-c1
  quote: Кассовые операции с физическими лицами, являющимися инвалидами по зрению, которые используют
    факсимильное воспроизведение их подписи, проставляемого с помощью средства механического копирования,
    осуществляется кассовым работником в присутствии контролирующего работника
  subject: кассовый работник
  kind: required
  requirement: При обслуживании инвалида по зрению, использующего факсимильную подпись, рядом находится
    контролирующий работник
  conditions: операция с физическим лицом, являющимся инвалидом по зрению с факсимильной подписью
  breach_visual: кассовый работник проводит операцию с клиентом один, без второго сотрудника; имеются
    визуальные признаки того, что клиент имеет инвалидность по зрению
  signals:
  - cashier_with_client
  - controller_present_or_absent
  - client_uses_stamp
  evidence: два сотрудника банка видны рядом со столом кассира; второй наблюдает за операцией
  insufficient_when: невозможно визуально определить инвалидность по зрению клиента; невозможно отличить
    контролирующего работника от другого посетителя
  observability: conditional
  plausible_in_dataset: maybe
  model_support: 'no'
  decision: not_verifiable
  rules: []
  decision_note: Нужно знать, что клиент — инвалид по зрению с факсимильной подписью; по видео не установить.
- id: R-231-12-c1-a
  unit: 231-12-c1
  quote: Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового
    узла
  subject: кассовый работник
  kind: prohibited
  requirement: Личные вещи и наличные деньги работников банка не хранятся в кассовом узле на рабочем месте
  conditions: во время рабочего времени в кассовом узле
  breach_visual: на столе или в видимых ящиках стола кассира видны личные вещи работника - телефон, сумочка,
    личные деньги, украшения, очки и т.п.
  signals:
  - personal_items_on_desk
  - cash_on_desk
  - worker_belongings
  evidence: личные предметы видны на рабочей поверхности или в открытых ящиках стола; явно не относятся
    к выполнению кассовых операций
  insufficient_when: невозможно определить, принадлежат ли видимые предметы кассиру или клиентам
  observability: partial
  plausible_in_dataset: 'yes'
  model_support: 'yes'
  decision: implemented
  rules:
  - W-NO-PERSONAL-ITEMS
  decision_note: PERSONAL_ON_DESK (сумка, верхняя одежда на столе кассира). Телефон этим правилом не покрыт.
- id: R-231-12-c2-a
  unit: 231-12-c2
  quote: Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий
    и средств связи, не имеющих функции фото и видео фиксации.
  subject: кассовый работник
  kind: required
  requirement: Средства связи в кассовом узле не имеют функции фото и видео съемки
  conditions: когда работник использует средство связи в кассовом узле
  breach_visual: кассовый работник держит в руках мобильный телефон со встроенной камерой или использует
    его в пределах касс-узла; могут быть видны действия по фотографированию или видеосъемке
  signals:
  - phone_in_cash_area
  - recording_device
  - worker_with_camera
  evidence: телефон виден в руках работника в кассовом узле; предпринимаются действия, напоминающие фотографирование
    или видеосъемку (наведение на документы, наличные деньги, рабочий стол)
  insufficient_when: невозможно определить функции телефона; работник держит телефон, но неясно, включена
    ли камера
  observability: conditional
  plausible_in_dataset: maybe
  model_support: partial
  decision: new_needs_logic
  rules:
  - W-NO-CAMERA-PHONE
  decision_note: 'OWLv2 детектирует метку phone, но events.py не делает из неё события, а у W-NO-CAMERA-PHONE
    нет функции-оценщика. Нужен интервал «телефон у кассира» и проверка на ложные срабатывания (калькулятор,
    терминал). Наличие камеры у телефона по видео не подтверждается, только предполагается: связь условная.'
- id: R-231-19-s1-a
  unit: 231-19-s1
  quote: проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим
    его личность
  subject: кассовый работник
  kind: required
  requirement: Кассовый работник проводит визуальную проверку соответствия внешности клиента документу,
    удостоверяющему личность
  conditions: при приеме наличных денег от клиента
  breach_visual: кассовый работник принимает наличные деньги от клиента без взгляда на его документ или
    лицо; не сравнивает внешность клиента с документом
  signals:
  - cashier_checks_id
  - client_shows_document
  - face_verification
  evidence: кассовый работник смотрит на лицо клиента и на предъявляемый им документ; явно сравнивает
    характеристики; виден процесс проверки
  insufficient_when: невозможно видеть содержание документа; невозможно определить, действительно ли кассир
    смотрит на лицо или только на документ
  observability: conditional
  plausible_in_dataset: 'yes'
  model_support: 'yes'
  decision: implemented
  rules:
  - C-ID-BEFORE-CASH
  decision_note: 'HANDOVER наличных от клиента без ID_SHOWN с начала сессии. С A21 срабатывает, только
    если вход клиента был виден и есть свидетельство, что место предъявления ID наблюдалось (id_absence_evidence):
    само отсутствие детекции ID не доказывает, что его не показали.'
- id: R-231-19-s2-a
  unit: 231-19-s2
  quote: принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность
    и платежность наличных денег
  subject: кассовый работник
  kind: required
  requirement: При приеме банкнот от клиента кассовый работник выполняет полистный пересчет с проверкой
    подлинности и платежности
  conditions: при приеме наличных денег в виде банкнот от клиента
  breach_visual: кассовый работник берет пачку банкнот без распускания и пересчета листов; не проводит
    проверку на счетной машине или вручную
  signals:
  - banknote_counting
  - sheet_by_sheet_recount
  - authenticity_check
  - banknote_counting_machine
  evidence: видно распускание пачки банкнот, пересчет листов по одному; использование счетной машины или
    проверка вручную; время, потраченное на проверку каждой банкноты или пачки
  insufficient_when: невозможно видеть детали пересчета (например, если камера над столом на высоте);
    клиент закрывает руками процесс пересчета
  observability: direct
  plausible_in_dataset: 'yes'
  model_support: partial
  decision: implemented
  rules:
  - C-COUNT-BEFORE-EXIT
  decision_note: Проверяется пересчёт на счётной машине (COUNT_*) до ухода клиента. Ручной полистный пересчёт
    и проверка подлинности на детекторе не распознаются; C-DETECTOR-CHECK без оценщика.
- id: R-231-19-s2-b
  unit: 231-19-s2
  quote: принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность
    и платежность наличных денег
  subject: кассовый работник
  kind: required
  requirement: При приеме монет от клиента кассовый работник выполняет пересчет по кружкам с проверкой
    подлинности и платежности
  conditions: при приеме наличных денег в виде монет от клиента
  breach_visual: кассовый работник принимает мешок или контейнер монет без открытия и пересчета содержимого
  signals:
  - coin_counting
  - circle_count_recount
  - authenticity_check
  - coins_being_checked
  evidence: видно открытие упаковки с монетами, пересчет по одной или малыми порциями, использование монетного
    счетчика или вручную
  insufficient_when: монеты могут быть в плотно запечатанной упаковке, скрывающей содержимое; высота камеры
    не позволяет видеть процесс пересчета
  observability: conditional
  plausible_in_dataset: 'yes'
  model_support: 'no'
  decision: not_verifiable
  rules: []
  decision_note: Монеты и пересчёт по кружкам детектор не различает.
- id: R-231-20-c1-a
  unit: 231-20-c1
  quote: Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента.
  subject: кассовый работник
  kind: required
  requirement: Клиент присутствует при приеме и пересчете его наличных денег
  conditions: при проведении операции приема наличных денег
  breach_visual: кассовый работник пересчитывает наличные деньги один, в отсутствие клиента; клиент стоит
    в стороне, отвернулся или ушел из видимой зоны
  signals:
  - client_present_at_desk
  - cash_counting
  - cashier_working
  - client_watching
  evidence: клиент видим рядом со столом кассира во время всей операции пересчета; клиент смотрит на процесс;
    расстояние между клиентом и столом минимально
  insufficient_when: несколько клиентов в кассовом зале; невозможно определить, какой именно клиент владелец
    пересчитываемых денег
  observability: direct
  plausible_in_dataset: 'yes'
  model_support: 'yes'
  decision: implemented
  rules:
  - C-COUNT-BEFORE-EXIT
  decision_note: 'Клиент ушёл до окончания пересчёта (SESSION_END до COUNT_END). Пересчёт без клиента
    вообще (клиента нет в кадре с начала) не проверяется: пересчёт вне обслуживания (инкассация, конец
    дня) законен, правило дало бы ложные срабатывания.'
- id: R-231-20-c2-a
  unit: 231-20-c2
  quote: На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные
    деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся
    на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола,
    тумба).
  subject: кассовый работник
  kind: required
  requirement: Наличные деньги, принятые ранее, хранятся в закрытых на ключ специальных устройствах у
    рабочего места кассира
  conditions: во время рабочего дня, между операциями приема наличных
  breach_visual: наличные деньги лежат открыто на столе кассира или в открытых ящиках; нет видимых закрытых
    на ключ устройств; деньги не убраны в сейф или шкаф
  signals:
  - cash_storage_device
  - locked_safe
  - cashier_desk_storage
  - cash_visible_on_desk
  evidence: видны закрытый металлический шкаф, сейф, запираемые ящики стола или специальная тележка рядом
    со столом кассира; деньги положены в эти устройства после операции; устройства заперты на видимый
    замок
  insufficient_when: невозможно определить, закрыт ли замок снаружи видимой зоны; деньги могут быть частично
    видны, но невозможно подтвердить наличие ключа
  observability: direct
  plausible_in_dataset: 'yes'
  model_support: 'yes'
  decision: implemented
  rules:
  - S-SAFE-CLOSED
  - S-CLEAN-DESK-HANDOVER
  - S-NO-MERGE
  - L-NO-CASH-ON-LEAVE
  decision_note: 'Ранее принятые деньги вне закрываемого устройства: открытый сейф без кассира (с A21
    состояние сейфа подтверждается локальной проверкой Qwen3-VL-4B, если она включена, иначе интервал
    SAFE_UNATTENDED), деньги прошлой сессии на столе при новом клиенте или при приёме новых денег, деньги
    на столе при уходе кассира.'
- id: R-231-22-a
  unit: 231-22-c1
  quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
  subject: кассовый работник
  kind: prohibited
  requirement: Кассовый работник не покидает свое рабочее место, пока клиент не закончит обслуживание
  conditions: во время обслуживания клиента у кассы
  breach_visual: кассовый работник встает и уходит от стола, оставляя клиента с наличными деньгами на
    столе; или ходит по помещению, не возвращаясь к клиенту; операция с клиентом не завершена
  signals:
  - cashier_leaves_desk
  - client_at_desk
  - unfinished_transaction
  - cash_on_desk
  evidence: кассовый работник встал со стула, покинул область стола и направился в другую часть помещения;
    клиент все еще рядом со столом с деньгами
  insufficient_when: невозможно определить, действительно ли операция завершена; кассовый работник может
    быть в кассовом узле, но вне видимой зоны; неясно, почему работник встал со стула (может быть технический
    перерыв, предусмотренный)
  observability: direct
  plausible_in_dataset: 'yes'
  model_support: 'yes'
  decision: implemented
  rules:
  - L-NO-CASH-ON-LEAVE
  - L-LEFT-DURING-SERVICE
  decision_note: 'До этой проверки норма покрывалась только вместе с деньгами на столе (L-NO-CASH-ON-LEAVE).
    Добавлено L-LEFT-DURING-SERVICE: подтверждённый выход кассира из помещения (ctx.room_exits(), как
    у правил про документы и ноутбук после A21), пока сессия клиента открыта; выход у самого конца записи
    не считается; при оставленных деньгах в ту же отлучку отчитывается только L-NO-CASH-ON-LEAVE.'
- id: R-231-23-a
  unit: 231-23-c1
  quote: Принятые в течение рабочего дня наличные деньги кассовый работник формирует, упаковывает и сдает
    по приходным кассовым документам заведующему кассой или лицу, осуществляющему функции заведующего
    кассой
  subject: кассовый работник
  kind: required
  requirement: Наличные деньги, принятые в течение дня, кассовый работник упаковывает и передает заведующему
    кассой
  conditions: в конце рабочего дня или при передаче денег (несколько раз в день)
  breach_visual: конец рабочего дня, но кассовый работник оставляет наличные деньги на своем столе в не
    упакованном виде; не передает их заведующему кассой
  signals:
  - end_of_day
  - cash_bundling
  - cash_handover
  - supervisor_receives_cash
  evidence: кассовый работник собирает деньги в упаковки (мешки, коробки), связывает или складывает в
    кассовый документ; встречается с заведующим кассой и передает ему упакованные деньги; видно принятие
    денег заведующим
  insufficient_when: невозможно определить, является ли встреченный сотрудник заведующим кассой; операция
    может происходить вне видимой зоны; неясно, завершен ли рабочий день
  observability: partial
  plausible_in_dataset: 'yes'
  model_support: 'no'
  decision: not_verifiable
  rules: []
  decision_note: Конец рабочего дня и передача заведующему кассой в коротком ролике не видны.
- id: R-231-23-c2-a
  unit: 231-23-c2
  quote: Допускается передача принятых наличных денег заведующему кассой или лицу, осуществляющему функции
    заведующего кассой, в течение рабочего дня несколько раз.
  subject: кассовый работник
  kind: required
  requirement: Кассовый работник может передавать упакованные наличные деньги заведующему кассой несколько
    раз в течение рабочего дня
  conditions: во время рабочего дня, при необходимости
  breach_visual: кассовый работник делает регулярные передачи денег заведующему в течение дня (видно несколько
    эпизодов, не только в конце дня)
  signals:
  - cash_handover_multiple_times
  - intraday_cash_transfer
  - supervisor_receives_cash
  evidence: видны несколько моментов встречи кассового работника с заведующим кассой; каждый раз происходит
    передача упакованных денег; эти события распределены на протяжении рабочего дня
  insufficient_when: невозможно определить, в какое время происходят передачи; одна длинная съемка не
    охватывает весь день
  observability: conditional
  plausible_in_dataset: maybe
  model_support: 'no'
  decision: not_applicable
  rules: []
  decision_note: Разрешающая норма, нарушения не описывает.
- id: R-231-24-s3-a
  unit: 231-24-s3
  quote: проверяет целостность сумки
  subject: кассовый работник
  kind: required
  requirement: При приеме денег от инкассаторской организации кассовый работник проверяет целостность
    сумки/контейнера
  conditions: при приеме наличных денег от подразделения инкассации банка или инкассаторской организации
  breach_visual: кассовый работник принимает сумку от инкассатора без визуальной проверки ее целостности
    (наличие повреждений, разрывов, вскрытия)
  signals:
  - money_bag_inspection
  - bag_integrity_check
  - collector_handover
  evidence: кассовый работник осматривает сумку со всех сторон, проверяет швы, пломбы, целостность материала;
    может потрогать сумку, проверяя прочность
  insufficient_when: сумка может быть осмотрена вне видимой зоны камеры; детали повреждений не видны отчетливо
  observability: partial
