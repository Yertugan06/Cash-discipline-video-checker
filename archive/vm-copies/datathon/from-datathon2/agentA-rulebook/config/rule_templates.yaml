L-NO-CASH-ON-LEAVE:
  title: Наличные на столе после ухода кассира
  description: В {time} с кассир покинул рабочую зону; после этого на поверхности стола видны наличные.
  title_en: Cash left on the desk after the cashier leaves
  description_en: At {time} s the cashier left the work area while detected cash remained on the desk.
L-NO-BAG-ON-LEAVE:
  title: Инкассаторская сумка на столе после ухода кассира
  description: В {time} с кассир покинул рабочую зону; на столе осталась обнаруженная сумка для наличных.
  title_en: Cash bag left on the desk
  description_en: At {time} s the cashier left the work area while a detected collection bag remained on the desk.
L-NO-DOCS-ON-LEAVE:
  title: Документ или планшет на столе после ухода кассира
  description: В {time} с кассир покинул рабочую зону; на столе остался документ или планшет.
  title_en: Document or tablet left on the desk
  description_en: At {time} s the cashier left the work area while a document or tablet remained on the desk.
L-PC-LOCKED:
  title: Рабочий экран ноутбука при уходе кассира
  description: В {time} с кассир покинул рабочую зону; видимый экран ноутбука классифицирован как рабочее приложение.
    Блокировку системы по видео подтвердить нельзя.
  title_en: Working laptop screen when the cashier leaves
  description_en: At {time} s the cashier left and the visible laptop screen was classified as a working application.
    The actual system lock cannot be verified from video.
S-SAFE-CLOSED:
  title: Открытый сейф без кассира рядом
  description: С {time} с сейф виден открытым, а кассир находится вне зоны сейфа дольше установленного интервала.
  title_en: Open safe without the cashier nearby
  description_en: From {time} s the safe appeared open and the cashier stayed outside the safe zone beyond the configured
    rule duration.
S-CLEAN-DESK-HANDOVER:
  title: Наличные предыдущего клиента при следующем обслуживании
  description: В {time} с началась следующая наблюдаемая клиентская сессия; на столе видны наличные, отслеженные
    из предыдущей сессии.
  title_en: Previous-session cash visible at the next session
  description_en: At {time} s a new observed client session began while cash tracked from a previous session remained
    visible on the desk.
A-DOOR-LOCK:
  title: Закрытие двери после входа не зафиксировано
  description: В {time} с зафиксирован вход; в последующем наблюдаемом интервале не обнаружены закрытая дверь или
    контакт руки с дверью. Фактическое запирание замка по видео не определяется.
  title_en: Door closure after entry not observed
  description_en: An entry was observed at {time} s. No closed-door state or hand contact with the door was detected
    in the subsequent observed window. The physical lock cannot be verified.
A-OUTSIDER-ZONE:
  title: Другой человек в рабочей зоне кассира
  description: С {time} с человек, не назначенный кассиром по положению и поведению, находится в рабочей зоне дольше
    установленного интервала. Его личность и допуск не определяются.
  title_en: Another person in the cashier work zone
  description_en: From {time} s a person not assigned the cashier role by position and behaviour stayed in the cashier
    zone beyond the rule duration. Identity and permission are not determined.
A-SECOND-PERSON:
  title: Передача предмета вторым посетителем
  description: В {time} с во время открытой клиентской сессии другой посетитель передал предмет кассиру или на стол.
  title_en: Item passed by a second visitor
  description_en: At {time} s another visitor passed an item to the cashier or desk during an open client session.
C-COUNT-BEFORE-EXIT:
  title: Уход клиента без зафиксированного пересчета
  description: В {time} с клиент вышел после наблюдаемой передачи наличных; для этих наличных до выхода не зафиксировано
    завершение пересчета.
  title_en: Client exit without observed count completion
  description_en: At {time} s a client exited after a visible cash transfer; completion of counting for this cash
    was not observed before the exit.
C-ID-BEFORE-CASH:
  title: Передача наличных без ранее показанного документа
  description: В {time} с зафиксирована первая передача наличных в полностью наблюдаемой клиентской сессии; до нее
    показ документа не зафиксирован.
  title_en: Cash transfer without an earlier document display
  description_en: At {time} s the first cash transfer occurred in a session with a visible entry; no document display
    was observed earlier in that session.
K-COLLECTOR-DOC:
  title: Быстрая передача сумки без показанного документа
  description: В {time} с посетитель, вошедший с сумкой, передал ее и вскоре вышел; в наблюдаемом интервале документ
    не обнаружен.
  title_en: Quick bag delivery without a visible document
  description_en: At {time} s a visitor who entered carrying a bag passed it and soon exited. No document was detected
    during the observed interval.
K-SEAL-CHECK:
  title: Осмотр переданной сумки не зафиксирован
  description: В {time} с посетитель передал сумку и вскоре вышел; контакт рук кассира с областью сумки, достаточный
    для видимого осмотра, не зафиксирован. Проверка пломбы вне кадра не оценивается.
  title_en: Inspection contact with the delivered bag not observed
  description_en: At {time} s a visitor passed a bag and soon exited. Sustained cashier hand contact with the bag
    was not observed. Inspection outside the image cannot be assessed.
K-RECOUNT-BEFORE-SAFE:
  title: Перемещение пачки из открытой сумки к сейфу без пересчета
  description: В {time} с отслеженная пачка переместилась из области открытой сумки в область сейфа; между этими
    действиями пересчет этой пачки не зафиксирован.
  title_en: Bundle moved from an open bag to the safe without an observed count
  description_en: At {time} s a tracked bundle moved from an open-bag region to the safe region. No count completion
    was observed between these actions.
W-NO-PERSONAL-ITEMS:
  title: Личная вещь на кассовом столе
  description: С {time} с на поверхности кассового стола обнаружена верхняя одежда или личная сумка дольше установленного
    интервала.
  title_en: Personal item on the cash desk
  description_en: From {time} s a coat or handbag was detected on the desk surface beyond the rule duration.
W-NO-FOOD:
  title: Еда или чашка поднята к голове у кассового стола
  description: В {time} с рука с обнаруженной едой или чашкой поднята к области головы человека у кассового стола.
    Фактическое употребление содержимого не определяется.
  title_en: Food or cup raised to the head near the cash desk
  description_en: At {time} s a hand holding detected food or a cup was raised to the head region near the desk.
    Actual consumption is not determined.
